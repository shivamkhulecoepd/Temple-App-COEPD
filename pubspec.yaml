name: mslgd
description: "Marakatha Sri Lakshmi Ganapathi Devasthanam app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.5.1
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.12.0
  marquee: ^2.3.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  syncfusion_flutter_pdfviewer: ^32.1.25
  translator: ^1.0.4+1
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  webview_flutter: ^4.13.1
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: ABeeZee
      fonts:
        - asset: fonts/ABeeZee-Regular.ttf
        - asset: fonts/ABeeZee-Italic.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf

  assets:
    - assets/images/
    - assets/images/dashboard/
    - assets/images/background/
    - assets/images/about/
    - assets/images/live_seva/
    - assets/audio/
    - assets/pdfs/
